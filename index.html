<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mehdi & Mouna — Invitation de Mariage</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@300;400;500;600;700&family=Great+Vibes&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

<style>

/* =========================================================
   GLOBAL
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#f6efe5;
    color:#3b2925;
    overflow-x:hidden;
}

a{
    text-decoration:none;
}


/* =========================================================
   OPENING
========================================================= */

.opening{
    position:fixed;
    inset:0;

    width:100%;
    height:100dvh;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#f7f1e8;

    z-index:9999;

    transition:
        opacity 1.4s ease,
        visibility 1.4s ease,
        transform 1.4s cubic-bezier(.77,0,.18,1);
}

.opening.hidden{
    opacity:0;
    visibility:hidden;
    transform:scale(1.05);
    pointer-events:none;
}

.opening::before{
    content:"";

    position:absolute;
    inset:0;

    background-image:
        radial-gradient(
            rgba(90,65,50,.05) 1px,
            transparent 1px
        );

    background-size:7px 7px;

    opacity:.25;
}

.opening-frame{
    position:absolute;
    inset:24px;

    border:1px solid rgba(105,72,58,.22);

    pointer-events:none;
}

.opening-frame::before,
.opening-frame::after{
    content:"";

    position:absolute;

    width:65px;
    height:65px;
}

.opening-frame::before{
    top:-1px;
    left:-1px;

    border-top:2px solid #7a1f2a;
    border-left:2px solid #7a1f2a;
}

.opening-frame::after{
    bottom:-1px;
    right:-1px;

    border-bottom:2px solid #7a1f2a;
    border-right:2px solid #7a1f2a;
}

.opening-content{
    position:relative;

    z-index:2;

    display:flex;

    flex-direction:column;

    align-items:center;

    text-align:center;
}

.opening-initials{
    font-family:"Cormorant Garamond",serif;

    font-size:17px;

    letter-spacing:7px;

    color:#7a1f2a;

    margin-bottom:25px;
}


/* =========================================================
   WAX SEAL
========================================================= */

.wax-wrapper{
    position:relative;

    width:145px;
    height:145px;

    display:flex;

    align-items:center;
    justify-content:center;

    cursor:pointer;

    animation:sealFloat 4s ease-in-out infinite;
}

.wax-wrapper::before{
    content:"";

    position:absolute;

    width:170px;
    height:170px;

    border:1px solid rgba(122,31,42,.18);

    border-radius:50%;

    animation:ringPulse 3s ease-in-out infinite;
}

.wax-seal{
    width:122px;
    height:122px;

    border-radius:50%;

    position:relative;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    color:#f7eadb;

    background:
        radial-gradient(
            circle at 35% 30%,
            #9e4652 0%,
            #7b202c 35%,
            #64151f 70%,
            #4d1018 100%
        );

    box-shadow:
        0 12px 25px rgba(78,27,31,.25),
        inset 7px 7px 12px rgba(255,255,255,.08),
        inset -8px -10px 15px rgba(25,0,5,.25);

    transition:.45s ease;
}

.wax-wrapper:hover .wax-seal{
    transform:scale(1.07) rotate(-2deg);
}

.wax-seal::before{
    content:"";

    position:absolute;

    inset:-4px;

    border-radius:
        47% 53% 50% 48%
        /
        51% 47% 53% 49%;

    border:2px solid rgba(103,17,27,.5);
}

.wax-mn{
    font-family:"Great Vibes",cursive;

    font-size:44px;

    line-height:1;
}

.wax-line{
    width:35px;
    height:1px;

    background:rgba(247,234,219,.55);

    margin:6px 0 4px;
}

.wax-text{
    font-family:"Cormorant Garamond",serif;

    font-size:9px;

    letter-spacing:3px;

    text-transform:uppercase;
}

.open-text{
    margin-top:31px;

    font-family:"Cormorant Garamond",serif;

    font-size:13px;

    letter-spacing:4px;

    text-transform:uppercase;

    color:#765f52;

    animation:fadeText 2s ease-in-out infinite alternate;
}

.open-subtext{
    margin-top:7px;

    font-family:"Cormorant Garamond",serif;

    font-size:13px;

    color:#9b887c;
}


/* =========================================================
   MAIN
========================================================= */

.main{
    opacity:0;

    visibility:hidden;

    transition:
        opacity 1.4s ease .3s,
        visibility 1.4s ease .3s;
}

.main.visible
